name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./desktop/src-tauri -> target

      - name: Setup Python & uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python 3.11 (engine build target)
        run: uv python install 3.11

      - name: Build bundle resources (engine/airllm wheels + uv.exe + catalog)
        run: python tools/build_bundle.py

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and release to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 签名私钥（仓库 Secrets 中配置；丢失后无法再发布可更新版本）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./desktop/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "AirLLM ${{ github.ref_name }}"
          releaseBody: |
            AirLLM 桌面版发布。更新包含：
            - 图形化引导、模型源与模型库
            - 引擎与推理库自动升级
            - 完整的安装/更新体验（NSIS + updater 清单）
          releaseDraft: false
          prerelease: false
